[project]
name = "archetype-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the Archetype AI Newton Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nathan Nam" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
]

[project.scripts]
archetype-mcp = "archetype_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archetype_mcp"]
